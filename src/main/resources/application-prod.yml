# 生产环境覆盖配置（可提交）：真值全部走环境变量，本文件只写 ${ENV:} 占位符
#
# 密钥集中管理（2026-10）：消费方一律引用 yuai.api-keys.xxx，真值由环境变量注入
yuai:
  api-keys:
    deepseek: ${DEEPSEEK_API_KEY:}
    dashscope: ${DASHSCOPE_API_KEY:}
    tavily: ${TAVILY_API_KEY:}
  rag:
    bootstrap-enabled: true
    store-type: pgvector

spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  ai:
    openai:
      api-key: ${yuai.api-keys.deepseek}
    dashscope:
      api-key: ${yuai.api-keys.dashscope}
