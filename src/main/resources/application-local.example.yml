spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yu_ai_agent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:replace-me}
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:replace-me}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:replace-me}

search-api:
  api-key: ${SEARCH_API_KEY:replace-me}

yuai:
  rag:
    bootstrap-enabled: false
    store-type: memory
